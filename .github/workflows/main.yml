name: Build Dopamine Jester IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone bad_query
        run: |
          git clone https://github.com/forcequitOS/bad_query.git /tmp/bad_query 2>/dev/null \
            || echo "bad_query unavailable, stub will be used"

      - name: Write project sources
        run: |
          set -e
          ROOT="DopamineJester"
          mkdir -p "$ROOT/UI" "$ROOT/Settings" "$ROOT/Exploit" "$ROOT/Resources"

          # copy real bad_query if cloned
          cp /tmp/bad_query/bad_query/bad_query.h "$ROOT/Exploit/" 2>/dev/null || true
          cp /tmp/bad_query/bad_query/bad_query.m "$ROOT/Exploit/" 2>/dev/null || true
          cp /tmp/bad_query/bad_query/bad_query.c "$ROOT/Exploit/" 2>/dev/null || true

          # stubs via base64 to avoid yaml parsing issues with ObjC generics
          if [ ! -f "$ROOT/Exploit/bad_query.h" ]; then
            echo 'I3ByYWdtYSBvbmNlCiNpbXBvcnQgPEZvdW5kYXRpb24vRm91bmRhdGlvbi5oPgpCT09MIGJxX2VzY2FwZShOU1N0cmluZyAqYXBwR3JvdXBJRCk7Ck5TQXJyYXk8TlNTdHJpbmcgKj4gKmJxX2FjY2Vzc2libGVfcGF0aHModm9pZCk7Cg==' | base64 -d > "$ROOT/Exploit/bad_query.h"
          fi
          if [ ! -f "$ROOT/Exploit/bad_query.m" ] && [ ! -f "$ROOT/Exploit/bad_query.c" ]; then
            echo '' | base64 -d > "$ROOT/Exploit/bad_query.m"
          fi

          # Info.plist
          cat > "$ROOT/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Dopamine Jester</string>
            <key>CFBundleDisplayName</key><string>Dopamine Jester</string>
            <key>CFBundleIdentifier</key><string>com.sussy.dopaminejester</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UILaunchStoryboardName</key><string></string>
            <key>NSPrincipalClass</key><string>UIApplication</string>
            <key>UIApplicationDelegateClassName</key><string>AppDelegate</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIRequiresFullScreen</key><true/>
            <key>NSPhotoLibraryUsageDescription</key><string>Select wallpaper for Post Board</string>
          </dict></plist>
          EOF

          # Entitlements - no app group, just get-task-allow
          cat > "$ROOT/DopamineJester.entitlements" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>get-task-allow</key><true/>
          </dict></plist>
          EOF

          # AppDelegate.h
          cat > "$ROOT/AppDelegate.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end
          EOF

          # AppDelegate.m
          cat > "$ROOT/AppDelegate.m" << 'EOF'
          #import "AppDelegate.h"
          #import "UI/MainViewController.h"
          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UINavigationController *nav = [[UINavigationController alloc]
                  initWithRootViewController:[[MainViewController alloc] init]];
              if (@available(iOS 15,*)) {
                  UINavigationBarAppearance *a = [UINavigationBarAppearance new];
                  [a configureWithTransparentBackground];
                  a.titleTextAttributes = @{NSForegroundColorAttributeName: UIColor.whiteColor};
                  nav.navigationBar.standardAppearance = a;
                  nav.navigationBar.scrollEdgeAppearance = a;
              }
              nav.navigationBar.tintColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
              self.window.rootViewController = nav;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end
          EOF

          # DJTweakStore.h - b64 because of NSArray generics
          echo '' | base64 -d > "$ROOT/DJTweakStore.h"

          # DJTweakStore.m - b64 because of NSArray generics and NSPredicate
          echo '' | base64 -d > "$ROOT/DJTweakStore.m"

          # UI/MainViewController.h
          cat > "$ROOT/UI/MainViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface MainViewController : UIViewController
          @end
          EOF

          # UI/MainViewController.m
          cat > "$ROOT/UI/MainViewController.m" << 'EOF'
          #import "MainViewController.h"
          #import "../DJTweakStore.h"
          #import "../Settings/DJSettingsViewController.h"
          #import "DJApplyViewController.h"
          @interface MainViewController ()
          @property (nonatomic, strong) CAGradientLayer *grad;
          @property (nonatomic, strong) UILabel  *logoLbl, *titleLbl, *subtitleLbl, *statusLbl, *versionLbl;
          @property (nonatomic, strong) UIView   *card;
          @property (nonatomic, strong) UIButton *applyBtn, *settingsBtn;
          @end
          @implementation MainViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.navigationController.navigationBar.hidden = YES;
              self.grad = [CAGradientLayer layer];
              self.grad.colors = @[(id)[UIColor colorWithRed:0.05 green:0.05 blue:0.09 alpha:1].CGColor,
                                   (id)[UIColor colorWithRed:0.09 green:0.07 blue:0.17 alpha:1].CGColor];
              self.grad.startPoint = CGPointMake(0,0); self.grad.endPoint = CGPointMake(0,1);
              [self.view.layer insertSublayer:self.grad atIndex:0];
              self.logoLbl = [UILabel new]; self.logoLbl.text = @"🃏";
              self.logoLbl.font = [UIFont systemFontOfSize:80]; self.logoLbl.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:self.logoLbl];
              self.titleLbl = [UILabel new]; self.titleLbl.text = @"Dopamine Jester";
              self.titleLbl.font = [UIFont systemFontOfSize:32 weight:UIFontWeightBold];
              self.titleLbl.textColor = UIColor.whiteColor; self.titleLbl.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:self.titleLbl];
              self.subtitleLbl = [UILabel new]; self.subtitleLbl.text = @"iOS Gesture Editor  •  bad_query";
              self.subtitleLbl.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
              self.subtitleLbl.textColor = [UIColor colorWithWhite:1 alpha:0.38];
              self.subtitleLbl.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:self.subtitleLbl];
              self.card = [UIView new];
              self.card.backgroundColor = [UIColor colorWithWhite:1 alpha:0.07];
              self.card.layer.cornerRadius = 20;
              self.card.layer.borderColor = [UIColor colorWithWhite:1 alpha:0.10].CGColor;
              self.card.layer.borderWidth = 1;
              [self.view addSubview:self.card];
              self.statusLbl = [UILabel new]; self.statusLbl.text = @"⬤  Not applied";
              self.statusLbl.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];
              self.statusLbl.textColor = [UIColor colorWithRed:0.55 green:0.55 blue:0.60 alpha:1];
              [self.card addSubview:self.statusLbl];
              self.versionLbl = [UILabel new];
              self.versionLbl.text = [NSString stringWithFormat:@"iOS %@", [[UIDevice currentDevice] systemVersion]];
              self.versionLbl.font = [UIFont systemFontOfSize:13];
              self.versionLbl.textColor = [UIColor colorWithWhite:1 alpha:0.30];
              self.versionLbl.textAlignment = NSTextAlignmentRight;
              [self.card addSubview:self.versionLbl];
              self.applyBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.applyBtn setTitle:@"Apply" forState:UIControlStateNormal];
              self.applyBtn.titleLabel.font = [UIFont systemFontOfSize:17 weight:UIFontWeightSemibold];
              [self.applyBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.applyBtn.backgroundColor = [UIColor colorWithRed:0.33 green:0.42 blue:1.0 alpha:1];
              self.applyBtn.layer.cornerRadius = 14;
              [self.applyBtn addTarget:self action:@selector(applyTapped) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.applyBtn];
              self.settingsBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.settingsBtn setTitle:@"Settings" forState:UIControlStateNormal];
              self.settingsBtn.titleLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightMedium];
              [self.settingsBtn setTitleColor:[UIColor colorWithWhite:1 alpha:0.70] forState:UIControlStateNormal];
              self.settingsBtn.backgroundColor = [UIColor colorWithWhite:1 alpha:0.08];
              self.settingsBtn.layer.cornerRadius = 14;
              [self.settingsBtn addTarget:self action:@selector(settingsTapped) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.settingsBtn];
              [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(refreshStatus) name:@"DJStoreChanged" object:nil];
          }
          - (void)viewDidLayoutSubviews {
              [super viewDidLayoutSubviews];
              self.grad.frame = self.view.bounds;
              CGFloat w = self.view.bounds.size.width, safe = self.view.safeAreaInsets.top;
              self.logoLbl.frame = CGRectMake(0, safe+40, w, 100);
              self.titleLbl.frame = CGRectMake(20, CGRectGetMaxY(self.logoLbl.frame)+12, w-40, 42);
              self.subtitleLbl.frame = CGRectMake(20, CGRectGetMaxY(self.titleLbl.frame)+6, w-40, 20);
              self.card.frame = CGRectMake(20, CGRectGetMaxY(self.subtitleLbl.frame)+32, w-40, 64);
              self.statusLbl.frame = CGRectMake(16, 0, (w-40)/2, 64);
              self.versionLbl.frame = CGRectMake((w-40)/2, 0, (w-40)/2-16, 64);
              self.applyBtn.frame = CGRectMake(20, CGRectGetMaxY(self.card.frame)+32, w-40, 54);
              self.settingsBtn.frame = CGRectMake(20, CGRectGetMaxY(self.applyBtn.frame)+12, w-40, 54);
          }
          - (void)applyTapped {
              self.navigationController.navigationBar.hidden = NO;
              [self.navigationController pushViewController:[DJApplyViewController new] animated:YES];
          }
          - (void)settingsTapped {
              self.navigationController.navigationBar.hidden = NO;
              [self.navigationController pushViewController:[DJSettingsViewController new] animated:YES];
          }
          - (void)refreshStatus {
              BOOL applied = [DJTweakStore shared].applied;
              self.statusLbl.text = applied ? @"⬤  Applied" : @"⬤  Not applied";
              self.statusLbl.textColor = applied
                  ? [UIColor colorWithRed:0.3 green:0.9 blue:0.5 alpha:1]
                  : [UIColor colorWithRed:0.55 green:0.55 blue:0.60 alpha:1];
          }
          - (void)dealloc { [[NSNotificationCenter defaultCenter] removeObserver:self]; }
          @end
          EOF

          # UI/DJApplyViewController.h
          cat > "$ROOT/UI/DJApplyViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface DJApplyViewController : UIViewController
          @end
          EOF

          # UI/DJApplyViewController.m - b64 for NSArray generics in log loop
          echo '' | base64 -d > "$ROOT/UI/DJApplyViewController.m"

          # Settings/DJSettingsViewController.h
          cat > "$ROOT/Settings/DJSettingsViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface DJSettingsViewController : UIViewController
          @end
          EOF

          # Settings/DJSettingsViewController.m
          cat > "$ROOT/Settings/DJSettingsViewController.m" << 'EOF'
          #import "DJSettingsViewController.h"
          #import "DJChangesViewController.h"
          #import "DJMobileJesterViewController.h"
          #import "DJPostBoardViewController.h"
          #import "DJFileExplorerViewController.h"
          @interface DJSettingsViewController ()
          @property (nonatomic, strong) UISegmentedControl *tabs;
          @property (nonatomic, strong) UIViewController   *active;
          @property (nonatomic, strong) UIButton           *saveBtn;
          @property (nonatomic, strong) NSArray            *pages;
          @end
          @implementation DJSettingsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Settings";
              self.view.backgroundColor = [UIColor colorWithRed:0.05 green:0.05 blue:0.09 alpha:1];
              self.pages = @[[DJChangesViewController new],[DJMobileJesterViewController new],
                             [DJPostBoardViewController new],[DJFileExplorerViewController new]];
              self.tabs = [[UISegmentedControl alloc] initWithItems:@[@"Changes",@"M.Jester",@"Post Board",@"Files"]];
              self.tabs.selectedSegmentIndex = 0;
              self.tabs.tintColor = [UIColor colorWithRed:0.44 green:0.55 blue:1 alpha:1];
              [self.tabs addTarget:self action:@selector(tabChanged) forControlEvents:UIControlEventValueChanged];
              self.navigationItem.titleView = self.tabs;
              self.saveBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.saveBtn setTitle:@"Save" forState:UIControlStateNormal];
              self.saveBtn.titleLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightSemibold];
              [self.saveBtn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              self.saveBtn.backgroundColor = [UIColor colorWithRed:0.33 green:0.42 blue:1.0 alpha:1];
              self.saveBtn.layer.cornerRadius = 14;
              [self.saveBtn addTarget:self action:@selector(saveTapped) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.saveBtn];
              [self tabChanged];
          }
          - (void)viewDidLayoutSubviews {
              [super viewDidLayoutSubviews];
              CGFloat w = self.view.bounds.size.width, bh = self.view.bounds.size.height;
              CGFloat safeB = self.view.safeAreaInsets.bottom, safeT = self.view.safeAreaInsets.top + 10;
              self.saveBtn.frame = CGRectMake(20, bh - safeB - 70, w-40, 54);
              if (self.active) self.active.view.frame = CGRectMake(0, safeT, w, bh - safeB - 80 - safeT);
          }
          - (void)tabChanged {
              if (self.active) {
                  [self.active willMoveToParentViewController:nil];
                  [self.active.view removeFromSuperview];
                  [self.active removeFromParentViewController];
              }
              UIViewController *vc = self.pages[self.tabs.selectedSegmentIndex];
              [self addChildViewController:vc];
              [self.view insertSubview:vc.view belowSubview:self.saveBtn];
              [vc didMoveToParentViewController:self];
              self.active = vc;
              [self.view setNeedsLayout];
          }
          - (void)saveTapped {
              [[NSNotificationCenter defaultCenter] postNotificationName:@"DJStoreChanged" object:nil];
              [self.navigationController popViewControllerAnimated:YES];
          }
          @end
          EOF

          # Settings/DJChangesViewController.h
          cat > "$ROOT/Settings/DJChangesViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface DJChangesViewController : UIViewController
          @end
          EOF

          # Settings/DJChangesViewController.m - b64 for NSArray generics
          echo '' | base64 -d > "$ROOT/Settings/DJChangesViewController.m"

          # Settings/DJMobileJesterViewController.h
          cat > "$ROOT/Settings/DJMobileJesterViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface DJMobileJesterViewController : UIViewController
          @end
          EOF

          # Settings/DJMobileJesterViewController.m
          cat > "$ROOT/Settings/DJMobileJesterViewController.m" << 'EOF'
          #import "DJMobileJesterViewController.h"
          #import "../DJTweakStore.h"
          @interface DJMobileJesterViewController () <UITableViewDataSource, UITableViewDelegate>
          @property (nonatomic, strong) UITableView *table;
          @end
          @implementation DJMobileJesterViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.clearColor;
              self.table = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStyleInsetGrouped];
              self.table.backgroundColor = UIColor.clearColor;
              self.table.dataSource = self; self.table.delegate = self;
              [self.view addSubview:self.table];
          }
          - (void)viewDidLayoutSubviews { [super viewDidLayoutSubviews]; self.table.frame = self.view.bounds; }
          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tv { return 2; }
          - (NSString *)tableView:(UITableView *)tv titleForHeaderInSection:(NSInteger)s {
              return s==0 ? @"Kernel Method" : @"Options";
          }
          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return 2; }
          - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
              UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:@"mj"];
              if (!cell) cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"mj"];
              cell.backgroundColor = [UIColor colorWithWhite:1 alpha:0.07];
              cell.textLabel.textColor = UIColor.whiteColor;
              DJTweakStore *store = [DJTweakStore shared];
              if (ip.section == 0) {
                  cell.textLabel.text = ip.row==0 ? @"bad_queue (default)" : @"PUAF/smith";
                  cell.accessoryType = (store.kernelMethod == ip.row) ? UITableViewCellAccessoryCheckmark : UITableViewCellAccessoryNone;
                  cell.selectionStyle = UITableViewCellSelectionStyleDefault;
              } else {
                  cell.textLabel.text = ip.row==0 ? @"Tweak Injection" : @"Hide Jailbreak";
                  UISwitch *sw = [UISwitch new]; sw.tag = ip.row;
                  sw.on = ip.row==0 ? store.tweakInjection : store.hideJB;
                  sw.onTintColor = [UIColor colorWithRed:0.33 green:0.42 blue:1 alpha:1];
                  [sw addTarget:self action:@selector(toggleOption:) forControlEvents:UIControlEventValueChanged];
                  cell.accessoryView = sw; cell.selectionStyle = UITableViewCellSelectionStyleNone;
              }
              return cell;
          }
          - (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
              [tv deselectRowAtIndexPath:ip animated:YES];
              if (ip.section != 0) return;
              [DJTweakStore shared].kernelMethod = (DJKernelMethod)ip.row;
              [tv reloadSections:[NSIndexSet indexSetWithIndex:0] withRowAnimation:UITableViewRowAnimationNone];
          }
          - (void)toggleOption:(UISwitch *)sw {
              if (sw.tag==0) [DJTweakStore shared].tweakInjection = sw.on;
              else           [DJTweakStore shared].hideJB = sw.on;
          }
          @end
          EOF

          # Settings/DJPostBoardViewController.h
          cat > "$ROOT/Settings/DJPostBoardViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface DJPostBoardViewController : UIViewController
          @end
          EOF

          # Settings/DJPostBoardViewController.m
          cat > "$ROOT/Settings/DJPostBoardViewController.m" << 'EOF'
          #import "DJPostBoardViewController.h"
          #import "../DJTweakStore.h"
          @interface DJPostBoardViewController () <UITableViewDataSource, UITableViewDelegate, UIImagePickerControllerDelegate, UINavigationControllerDelegate>
          @property (nonatomic, strong) UITableView *table;
          @end
          @implementation DJPostBoardViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = UIColor.clearColor;
              self.table = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStyleInsetGrouped];
              self.table.backgroundColor = UIColor.clearColor;
              self.table.dataSource = self; self.table.delegate = self;
              [self.view addSubview:self.table];
          }
          - (void)viewDidLayoutSubviews { [super viewDidLayoutSubviews]; self.table.frame = self.view.bounds; }
          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tv { return 2; }
          - (NSString *)tableView:(UITableView *)tv titleForHeaderInSection:(NSInteger)s {
              return s==0 ? @"PPL Bypass" : @"Wallpaper";
          }
          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return 1; }
          - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
              UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:@"pb"];
              if (!cell) cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:@"pb"];
              cell.backgroundColor = [UIColor colorWithWhite:1 alpha:0.07];
              cell.textLabel.textColor = UIColor.whiteColor;
              if (ip.section==0) {
                  cell.textLabel.text = @"Enable PPL Bypass";
                  UISwitch *sw = [UISwitch new]; sw.on = [DJTweakStore shared].pplBypass;
                  sw.onTintColor = [UIColor colorWithRed:0.33 green:0.42 blue:1 alpha:1];
                  [sw addTarget:self action:@selector(togglePPL:) forControlEvents:UIControlEventValueChanged];
                  cell.accessoryView = sw; cell.selectionStyle = UITableViewCellSelectionStyleNone;
              } else {
                  cell.textLabel.text = [DJTweakStore shared].wallpaper ? @"Wallpaper Selected ✓" : @"Choose Wallpaper…";
                  cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
                  cell.selectionStyle = UITableViewCellSelectionStyleDefault;
              }
              return cell;
          }
          - (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
              [tv deselectRowAtIndexPath:ip animated:YES];
              if (ip.section!=1) return;
              UIImagePickerController *picker = [UIImagePickerController new];
              picker.sourceType = UIImagePickerControllerSourceTypePhotoLibrary; picker.delegate = self;
              [self presentViewController:picker animated:YES completion:nil];
          }
          - (void)togglePPL:(UISwitch *)sw { [DJTweakStore shared].pplBypass = sw.on; }
          - (void)imagePickerController:(UIImagePickerController *)picker didFinishPickingMediaWithInfo:(NSDictionary *)info {
              UIImage *img = info[UIImagePickerControllerOriginalImage];
              if (img) [DJTweakStore shared].wallpaper = img;
              [picker dismissViewControllerAnimated:YES completion:^{ [self.table reloadData]; }];
          }
          - (void)imagePickerControllerDidCancel:(UIImagePickerController *)picker {
              [picker dismissViewControllerAnimated:YES completion:nil];
          }
          @end
          EOF

          # Settings/DJFileExplorerViewController.h
          cat > "$ROOT/Settings/DJFileExplorerViewController.h" << 'EOF'
          #import <UIKit/UIKit.h>
          @interface DJFileExplorerViewController : UIViewController
          @end
          EOF

          # Settings/DJFileExplorerViewController.m - b64 for NSArray generics
          echo '' | base64 -d > "$ROOT/Settings/DJFileExplorerViewController.m"

          # main.m
          cat > "$ROOT/main.m" << 'EOF'
          #import <UIKit/UIKit.h>
          #import "AppDelegate.h"
          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class])); }
          }
          EOF

      - name: Write project.yml
        run: |
          cat > "project.yml" << 'EOF'
          name: DopamineJester
          options:
            bundleIdPrefix: com.sussy
            deploymentTarget:
              iOS: "14.0"
            xcodeVersion: "16"
          settings:
            base:
              CLANG_ENABLE_OBJC_ARC: YES
              PRODUCT_BUNDLE_IDENTIFIER: com.sussy.dopaminejester
              INFOPLIST_FILE: DopamineJester/Info.plist
              CODE_SIGN_ENTITLEMENTS: DopamineJester/DopamineJester.entitlements
              TARGETED_DEVICE_FAMILY: "1,2"
          targets:
            DopamineJester:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources:
                - path: DopamineJester
                  excludes:
                    - "**/*.md"
                    - "**/*.plist"
                    - "**/*.entitlements"
          EOF

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild \
            -project DopamineJester.xcodeproj \
            -scheme DopamineJester \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

          APP=$(find build -name "DopamineJester.app" | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r DopamineJester.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DopamineJester
          path: DopamineJester.ipa
